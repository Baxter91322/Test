[project]
name = "scandi-outreach"
version = "0.1.0"
description = "Daily Scandinavian VC outreach automation"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.92.0",
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pyyaml>=6.0",
    "click>=8.1",
    "tenacity>=8.5",
    "python-dotenv>=1.0",
]

[project.scripts]
scandi-outreach = "scandi_outreach.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scandi_outreach*"]

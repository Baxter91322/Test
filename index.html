<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
    <title>Plateau Moto - Parcours Officiel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 10px 16px;
            border-bottom: 3px solid #f97316;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }

        header h1 {
            font-size: 1.1rem;
            color: #f97316;
        }

        .controls {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        button {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.15s;
            white-space: nowrap;
        }

        button:active { transform: scale(0.96); }

        .btn-exercice {
            background: #1e293b;
            color: #94a3b8;
            border: 2px solid #334155;
            font-size: 0.75rem;
            padding: 5px 10px;
        }
        .btn-exercice.active { border-color: var(--exo-color, #f97316); color: #fff; background: #334155; }

        .btn-draw { background: #f97316; color: #fff; }
        .btn-draw.active { background: #fb923c; box-shadow: 0 0 10px rgba(249,115,22,0.4); }
        .btn-clear { background: #7c3aed; color: white; }
        .btn-undo { background: #334155; color: white; }
        .btn-check { background: #059669; color: white; }
        .btn-solution { background: #334155; color: #94a3b8; border: 2px solid #059669; }
        .btn-solution.active { background: #059669; color: white; }

        .canvas-wrap {
            margin: 8px auto;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            max-width: 100%;
            padding: 8px;
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 8px;
            background: #1e293b;
            box-shadow: 0 4px 24px rgba(0,0,0,0.5);
        }

        .info-bar {
            max-width: 1300px;
            margin: 6px auto;
            padding: 10px 16px;
            background: #1e293b;
            border-radius: 8px;
            text-align: center;
            font-size: 0.85rem;
            line-height: 1.5;
            border-left: 4px solid #f97316;
        }

        .result-bar {
            max-width: 1300px;
            margin: 6px auto;
            padding: 12px 16px;
            border-radius: 8px;
            text-align: center;
            font-size: 1rem;
            font-weight: bold;
            display: none;
        }
        .result-bar.success { display:block; background:linear-gradient(135deg,#059669,#34d399); color:#0f172a; }
        .result-bar.partial { display:block; background:linear-gradient(135deg,#d97706,#fbbf24); color:#0f172a; }
        .result-bar.fail    { display:block; background:linear-gradient(135deg,#dc2626,#f87171); color:#fff; }
        .result-details { font-size:0.82rem; font-weight:normal; margin-top:4px; }

        .legend {
            max-width: 1300px;
            margin: 8px auto;
            padding: 10px 16px;
            background: #1e293b;
            border-radius: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            font-size: 0.78rem;
        }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .legend-dot {
            width: 12px; height: 12px; border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.2);
            flex-shrink: 0;
        }

        @media (max-width: 700px) {
            header { flex-direction: column; align-items: flex-start; }
            .controls { width: 100%; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; }
            button { flex-shrink: 0; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Plateau Moto</h1>
        <div class="controls">
            <button class="btn-exercice active" data-exo="0" style="--exo-color:#3b82f6">Poussette</button>
            <button class="btn-exercice" data-exo="1" style="--exo-color:#f97316">Lent</button>
            <button class="btn-exercice" data-exo="2" style="--exo-color:#ef4444">Rapide+Frein</button>
            <button class="btn-exercice" data-exo="3" style="--exo-color:#fb923c">Lent+Passager</button>
            <button class="btn-exercice" data-exo="4" style="--exo-color:#8b5cf6">Slalom Rapide</button>
            <button class="btn-draw" id="btn-draw">Dessiner</button>
            <button class="btn-check" id="btn-check">Verifier</button>
            <button class="btn-undo" id="btn-undo">Annuler</button>
            <button class="btn-clear" id="btn-clear">Effacer</button>
            <button class="btn-solution" id="btn-solution">Solution</button>
        </div>
    </header>

    <div class="info-bar" id="info-bar"></div>
    <div class="result-bar" id="result-bar"></div>

    <div class="canvas-wrap">
        <canvas id="plateau"></canvas>
    </div>

    <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#f97316"></div>Cone orange (x17)</div>
        <div class="legend-item"><div class="legend-dot" style="background:#3b82f6"></div>Cone bleu (x5)</div>
        <div class="legend-item"><div class="legend-dot" style="background:#a855f7"></div>Piquet (x4)</div>
        <div class="legend-item"><div class="legend-dot" style="background:#00b4d8"></div>Votre trace</div>
        <div class="legend-item"><div class="legend-dot" style="background:#34d399"></div>Solution</div>
    </div>

    <script>
    (function() {
        const canvas = document.getElementById('plateau');
        const ctx = canvas.getContext('2d');

        // ==========================================
        // PLATEAU - Layout horizontal fidele
        // Dimensions approx: 80m x 18m
        // ==========================================
        const S = 9;
        const PW = 82, PH = 18;
        const OX = 35, OY = 50;

        canvas.width = PW * S + OX * 2;
        canvas.height = PH * S + OY * 2;

        function mx(m) { return OX + m * S; }
        function my(m) { return OY + m * S; }

        // ==========================================
        // 17 CONES ORANGE
        // ==========================================
        const orangeCones = [
            { x: 3,  y: 6,  id: 'C1' },
            { x: 3,  y: 12, id: 'C2' },
            { x: 7,  y: 6,  id: 'C3' },
            { x: 7,  y: 12, id: 'C4' },
            { x: 16, y: 9,  id: 'C5' },
            { x: 24, y: 9,  id: 'C6' },
            { x: 32, y: 9,  id: 'C7' },
            { x: 40, y: 9,  id: 'C8' },
            { x: 48, y: 9,  id: 'C9' },
            { x: 56, y: 5,  id: 'C10' },
            { x: 56, y: 13, id: 'C11' },
            { x: 64, y: 5,  id: 'C12' },
            { x: 64, y: 13, id: 'C13' },
            { x: 72, y: 5,  id: 'C14' },
            { x: 72, y: 13, id: 'C15' },
            { x: 78, y: 5,  id: 'C16' },
            { x: 78, y: 13, id: 'C17' },
        ];

        // ==========================================
        // 5 CONES BLEUS
        // ==========================================
        const blueCones = [
            { x: 10, y: 6,  id: 'B1' },
            { x: 10, y: 12, id: 'B2' },
            { x: 13, y: 9,  id: 'B3' },
            { x: 52, y: 5,  id: 'B4' },
            { x: 52, y: 13, id: 'B5' },
        ];

        // ==========================================
        // 4 PIQUETS (portes)
        // ==========================================
        const piquets = [
            { x: 10, y: 3,  id: 'P1' },
            { x: 10, y: 15, id: 'P2' },
            { x: 52, y: 3,  id: 'P3' },
            { x: 52, y: 15, id: 'P4' },
        ];

        // ==========================================
        // 5 EXERCICES avec parcours
        // ==========================================
        const EXERCISES = [
            {
                name: "Poussette",
                color: "#3b82f6",
                dash: [8, 6],
                desc: "<strong>Exercice 1 - Deplacement sans moteur :</strong> Deplacez la moto sans l'aide du moteur. Depart entre C1-C2, avancez jusqu'a C3-C4, tournez et revenez.",
                path: [
                    {x:3,y:9},{x:5,y:9},{x:7,y:9},{x:10,y:8},
                    {x:10,y:6.5},{x:8,y:5},{x:5,y:5},{x:3,y:6},
                ],
            },
            {
                name: "Allure lente sans passager",
                color: "#f97316",
                dash: [],
                desc: "<strong>Exercice 2 - Allure lente :</strong> Entrez par P1-P2, slalom entre C5-C9, demi-tour entre C10-C13, retour slalom inverse, arret entre P1-P2.",
                path: [
                    {x:10,y:9},{x:13,y:9},
                    {x:16,y:6},{x:20,y:12},{x:24,y:6},{x:28,y:12},
                    {x:32,y:6},{x:36,y:12},{x:40,y:6},{x:44,y:12},
                    {x:48,y:6},{x:52,y:6},
                    {x:56,y:5.5},{x:60,y:5},{x:64,y:6},{x:64,y:9},
                    {x:64,y:13},{x:60,y:14},{x:56,y:13},{x:52,y:13},
                    {x:48,y:12},{x:44,y:6},{x:40,y:12},{x:36,y:6},
                    {x:32,y:12},{x:28,y:6},{x:24,y:12},{x:20,y:6},
                    {x:16,y:12},{x:13,y:9},{x:10,y:9},
                ],
            },
            {
                name: "Allure normale + freinage",
                color: "#ef4444",
                dash: [],
                desc: "<strong>Exercice 3 - Vitesse + Freinage :</strong> Depart lance par P1-P2, passage direct, virage dans la zone C10-C13, retour par P3-P4, freinage entre C14-C17.",
                path: [
                    {x:10,y:9},{x:13,y:7},{x:20,y:6},{x:30,y:5.5},
                    {x:40,y:5.5},{x:48,y:5.5},{x:52,y:5},
                    {x:56,y:5.5},{x:60,y:8},{x:62,y:12},
                    {x:60,y:14},{x:56,y:13},{x:52,y:12},
                    {x:52,y:9},{x:56,y:9},{x:64,y:9},
                    {x:72,y:9},{x:78,y:9},
                ],
            },
            {
                name: "Allure lente avec passager",
                color: "#fb923c",
                dash: [6, 4],
                desc: "<strong>Exercice 4 - Lent + passager :</strong> Meme slalom que l'exercice 2 mais avec un passager. Entree par P1-P2, slalom, demi-tour, retour.",
                path: [
                    {x:10,y:9},{x:13,y:9},
                    {x:16,y:12},{x:20,y:6},{x:24,y:12},{x:28,y:6},
                    {x:32,y:12},{x:36,y:6},{x:40,y:12},{x:44,y:6},
                    {x:48,y:12},{x:52,y:12},
                    {x:56,y:13},{x:60,y:14},{x:64,y:13},{x:64,y:9},
                    {x:64,y:5},{x:60,y:5},{x:56,y:6},{x:52,y:6},
                    {x:48,y:6},{x:44,y:12},{x:40,y:6},{x:36,y:12},
                    {x:32,y:6},{x:28,y:12},{x:24,y:6},{x:20,y:12},
                    {x:16,y:6},{x:13,y:9},{x:10,y:9},
                ],
            },
            {
                name: "Slalom rapide",
                color: "#8b5cf6",
                dash: [],
                desc: "<strong>Exercice 5 - Slalom rapide :</strong> Depart lance par P1-P2, slalom rapide C5-C9, passage P3-P4, virage zone droite, retour direct, freinage C14-C17.",
                path: [
                    {x:10,y:9},{x:13,y:9},
                    {x:16,y:6},{x:20,y:12},{x:24,y:6},{x:28,y:12},
                    {x:32,y:6},{x:36,y:12},{x:40,y:6},{x:44,y:12},
                    {x:48,y:6},{x:52,y:6},
                    {x:56,y:5.5},{x:60,y:5},{x:64,y:6},{x:66,y:9},
                    {x:64,y:13},{x:60,y:13.5},{x:56,y:13},{x:52,y:12},
                    {x:52,y:9},{x:56,y:9},{x:64,y:9},
                    {x:72,y:9},{x:78,y:9},
                ],
            },
        ];

        // ==========================================
        // STATE
        // ==========================================
        let currentExo = 0;
        let drawMode = false;
        let isDrawing = false;
        let showSolution = false;
        let paths = [];
        let currentPath = [];
        let checkResults = null;

        // ==========================================
        // RENDER
        // ==========================================

        function drawGround() {
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Asphalt
            ctx.fillStyle = '#374151';
            ctx.fillRect(mx(0), my(0), PW * S, PH * S);

            // White border
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.strokeRect(mx(0), my(0), PW * S, PH * S);

            // Subtle grid
            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.lineWidth = 0.5;
            for (let x = 0; x <= PW; x += 2) {
                ctx.beginPath(); ctx.moveTo(mx(x), my(0)); ctx.lineTo(mx(x), my(PH)); ctx.stroke();
            }
            for (let y = 0; y <= PH; y += 2) {
                ctx.beginPath(); ctx.moveTo(mx(0), my(y)); ctx.lineTo(mx(PW), my(y)); ctx.stroke();
            }

            // Center dashed line
            ctx.strokeStyle = 'rgba(255,255,255,0.06)';
            ctx.lineWidth = 1;
            ctx.setLineDash([12, 8]);
            ctx.beginPath(); ctx.moveTo(mx(0), my(9)); ctx.lineTo(mx(PW), my(9)); ctx.stroke();
            ctx.setLineDash([]);

            // Zone labels
            ctx.fillStyle = 'rgba(255,255,255,0.18)';
            ctx.font = '11px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('POUSSETTE', mx(5), my(-1.8));
            ctx.fillText('SLALOM', mx(32), my(-1.8));
            ctx.fillText('DEMI-TOUR', mx(60), my(-1.8));
            ctx.fillText('FREINAGE', mx(75), my(-1.8));

            // Zone tints
            ctx.fillStyle = 'rgba(59,130,246,0.05)';
            ctx.fillRect(mx(0), my(0), 12 * S, PH * S);
            ctx.fillStyle = 'rgba(249,115,22,0.03)';
            ctx.fillRect(mx(12), my(0), 42 * S, PH * S);
            ctx.fillStyle = 'rgba(168,85,247,0.04)';
            ctx.fillRect(mx(54), my(0), 12 * S, PH * S);
            ctx.fillStyle = 'rgba(239,68,68,0.04)';
            ctx.fillRect(mx(70), my(0), 10 * S, PH * S);

            // Gate lines
            ctx.strokeStyle = 'rgba(168,85,247,0.2)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([4, 4]);
            ctx.beginPath(); ctx.moveTo(mx(10), my(3)); ctx.lineTo(mx(10), my(15)); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(mx(52), my(3)); ctx.lineTo(mx(52), my(15)); ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawCone(x, y, color, label) {
            const px = mx(x), py = my(y);
            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            ctx.beginPath(); ctx.arc(px+1.5, py+1.5, 5, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = color;
            ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.6)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            if (label) {
                ctx.fillStyle = 'rgba(255,255,255,0.55)';
                ctx.font = '8px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(label, px, py - 9);
            }
        }

        function drawPiquet(x, y, label) {
            const px = mx(x), py = my(y);
            ctx.fillStyle = '#a855f7';
            ctx.beginPath();
            ctx.moveTo(px, py-9); ctx.lineTo(px+5, py); ctx.lineTo(px, py+9); ctx.lineTo(px-5, py);
            ctx.closePath(); ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
            if (label) {
                ctx.fillStyle = 'rgba(255,255,255,0.55)';
                ctx.font = 'bold 8px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(label, px, py - 14);
            }
        }

        function drawSmoothPath(pts, color, lw, dash) {
            if (pts.length < 2) return;
            ctx.strokeStyle = color; ctx.lineWidth = lw;
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            ctx.setLineDash(dash || []);
            ctx.globalAlpha = 0.8;
            ctx.beginPath();
            ctx.moveTo(mx(pts[0].x), my(pts[0].y));
            for (let i = 1; i < pts.length - 1; i++) {
                const cx = (mx(pts[i].x) + mx(pts[i+1].x)) / 2;
                const cy = (my(pts[i].y) + my(pts[i+1].y)) / 2;
                ctx.quadraticCurveTo(mx(pts[i].x), my(pts[i].y), cx, cy);
            }
            ctx.lineTo(mx(pts[pts.length-1].x), my(pts[pts.length-1].y));
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.globalAlpha = 1;

            // Start marker
            ctx.fillStyle = color;
            ctx.beginPath(); ctx.arc(mx(pts[0].x), my(pts[0].y), 6, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.font = 'bold 8px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText('D', mx(pts[0].x), my(pts[0].y)+3);

            // Arrow at end
            const last = pts[pts.length-1], prev = pts[pts.length-2];
            const a = Math.atan2(my(last.y)-my(prev.y), mx(last.x)-mx(prev.x));
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(mx(last.x), my(last.y));
            ctx.lineTo(mx(last.x)-12*Math.cos(a-0.35), my(last.y)-12*Math.sin(a-0.35));
            ctx.lineTo(mx(last.x)-12*Math.cos(a+0.35), my(last.y)-12*Math.sin(a+0.35));
            ctx.closePath(); ctx.fill();
        }

        function drawUserPaths() {
            const all = [...paths];
            if (currentPath.length > 0) all.push(currentPath);
            all.forEach(p => {
                if (p.length < 2) return;
                ctx.strokeStyle = '#00b4d8'; ctx.lineWidth = 3;
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.globalAlpha = 0.9;
                ctx.beginPath();
                ctx.moveTo(p[0].x, p[0].y);
                for (let i = 1; i < p.length; i++) ctx.lineTo(p[i].x, p[i].y);
                ctx.stroke();
                ctx.globalAlpha = 1;
            });
        }

        function drawCheckpoints() {
            if (!checkResults) return;
            checkResults.forEach(cp => {
                const px = mx(cp.x), py = my(cp.y), r = cp.r * S;
                ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI*2);
                ctx.fillStyle = cp.hit ? 'rgba(52,211,153,0.12)' : 'rgba(248,113,113,0.12)';
                ctx.fill();
                ctx.strokeStyle = cp.hit ? '#34d399' : '#f87171';
                ctx.lineWidth = 2; ctx.stroke();
                ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
                ctx.fillStyle = cp.hit ? '#34d399' : '#f87171';
                ctx.fillText(cp.hit ? '\u2713' : '\u2717', px, py + 5);
            });
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGround();
            orangeCones.forEach(c => drawCone(c.x, c.y, '#f97316', c.id));
            blueCones.forEach(c => drawCone(c.x, c.y, '#3b82f6', c.id));
            piquets.forEach(p => drawPiquet(p.x, p.y, p.id));
            if (showSolution) {
                const e = EXERCISES[currentExo];
                drawSmoothPath(e.path, e.color, 3, [10, 6]);
            }
            drawUserPaths();
            drawCheckpoints();
        }

        // ==========================================
        // VALIDATION
        // ==========================================

        function validate() {
            const allPts = paths.flat();
            if (allPts.length < 10) {
                showResult('fail', 'Dessinez le parcours complet avant de verifier !', '');
                return;
            }
            const exo = EXERCISES[currentExo];
            const R = 3.5;
            const cps = exo.path.map((p, i) => ({
                x: p.x, y: p.y,
                r: (i === 0 || i === exo.path.length-1) ? 4.5 : R,
                label: i === 0 ? 'Depart' : i === exo.path.length-1 ? 'Arrivee' : 'CP' + i,
                hit: false,
            }));

            let searchStart = 0;
            for (let i = 0; i < cps.length; i++) {
                for (let j = searchStart; j < allPts.length; j++) {
                    const pmx = (allPts[j].x - OX) / S;
                    const pmy = (allPts[j].y - OY) / S;
                    const d = Math.hypot(pmx - cps[i].x, pmy - cps[i].y);
                    if (d <= cps[i].r) { cps[i].hit = true; searchStart = j; break; }
                }
            }

            checkResults = cps;
            const passed = cps.filter(c => c.hit).length;
            const total = cps.length;
            const pct = Math.round(passed / total * 100);
            const missed = cps.filter(c => !c.hit).map(c => c.label);

            if (pct === 100) showResult('success', 'PARFAIT ! ' + passed + '/' + total + ' (' + pct + '%)', 'Vous maitrisez ce parcours !');
            else if (pct >= 60) showResult('partial', 'PRESQUE ! ' + passed + '/' + total + ' (' + pct + '%)', 'Rates : ' + missed.join(', '));
            else showResult('fail', 'A RETRAVAILLER ' + passed + '/' + total + ' (' + pct + '%)', 'Rates : ' + missed.join(', '));
            render();
        }

        function showResult(type, title, detail) {
            const bar = document.getElementById('result-bar');
            bar.className = 'result-bar ' + type;
            bar.innerHTML = title + '<div class="result-details">' + detail + '</div>';
        }

        // ==========================================
        // EVENTS
        // ==========================================

        function getPos(e) {
            const r = canvas.getBoundingClientRect();
            const sx = canvas.width / r.width, sy = canvas.height / r.height;
            const src = e.touches ? e.touches[0] : e;
            return { x: (src.clientX - r.left) * sx, y: (src.clientY - r.top) * sy };
        }

        function resetCheck() {
            checkResults = null;
            document.getElementById('result-bar').className = 'result-bar';
        }

        canvas.addEventListener('mousedown', e => {
            if (!drawMode) return;
            isDrawing = true; currentPath = [getPos(e)]; resetCheck();
        });
        canvas.addEventListener('mousemove', e => {
            if (!isDrawing) return;
            currentPath.push(getPos(e)); render();
        });
        canvas.addEventListener('mouseup', () => {
            if (!isDrawing) return;
            isDrawing = false;
            if (currentPath.length > 1) paths.push([...currentPath]);
            currentPath = [];
        });

        canvas.addEventListener('touchstart', e => {
            if (!drawMode) return;
            e.preventDefault(); isDrawing = true; currentPath = [getPos(e)]; resetCheck();
        }, {passive:false});
        canvas.addEventListener('touchmove', e => {
            if (!isDrawing) return;
            e.preventDefault(); currentPath.push(getPos(e)); render();
        }, {passive:false});
        canvas.addEventListener('touchend', e => {
            if (!isDrawing) return;
            e.preventDefault(); isDrawing = false;
            if (currentPath.length > 1) paths.push([...currentPath]);
            currentPath = [];
        });

        document.getElementById('btn-draw').addEventListener('click', function() {
            drawMode = !drawMode;
            this.classList.toggle('active', drawMode);
            this.textContent = drawMode ? 'Dessiner (ON)' : 'Dessiner';
            canvas.style.cursor = drawMode ? 'crosshair' : 'default';
        });
        document.getElementById('btn-check').addEventListener('click', validate);
        document.getElementById('btn-clear').addEventListener('click', () => {
            paths=[]; currentPath=[]; resetCheck(); render();
        });
        document.getElementById('btn-undo').addEventListener('click', () => {
            paths.pop(); resetCheck(); render();
        });
        document.getElementById('btn-solution').addEventListener('click', function() {
            showSolution = !showSolution;
            this.classList.toggle('active', showSolution);
            this.textContent = showSolution ? 'Solution (ON)' : 'Solution';
            render();
        });

        document.querySelectorAll('.btn-exercice').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.btn-exercice').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentExo = parseInt(this.dataset.exo);
                paths=[]; currentPath=[]; resetCheck(); updateInfo(); render();
            });
        });

        function updateInfo() {
            document.getElementById('info-bar').innerHTML = EXERCISES[currentExo].desc;
        }

        // Responsive
        function resize() {
            const maxW = window.innerWidth - 24;
            const ratio = canvas.height / canvas.width;
            const w = Math.min(canvas.width, maxW);
            canvas.style.width = w + 'px';
            canvas.style.height = (w * ratio) + 'px';
        }
        window.addEventListener('resize', resize);
        resize();

        updateInfo();
        render();
    })();
    </script>
</body>
</html>
